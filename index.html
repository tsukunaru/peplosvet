<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#151c19"><title>Пеплосвет: Последний кордон</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ceac68' d='M12 2h8v6h6v8h-6v14h-8V16H6V8h6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="world" aria-label="Игровой мир" tabindex="0"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header id="topbar"><div class="brand"><span class="brand-icon">✦</span><div><b id="brand">ПЕПЛОСВЕТ</b><small id="subtitle">ПОСЛЕДНИЙ КОРДОН</small></div><span class="version">α 0.1</span></div><div id="location"></div><div class="top-actions"><span id="day"></span><button id="sound" class="square" aria-label="Звук">♪</button><button id="pause" class="square" aria-label="Пауза">Ⅱ</button></div></header>
    <aside id="vitals" class="panel"></aside>
    <aside id="right"><section class="panel map-panel"><div class="eyebrow"><span id="map-label"></span><button id="map-open" aria-label="Карта">↗</button></div><canvas id="minimap" width="180" height="130"></canvas><div id="map-coords"></div></section><button id="mission" class="panel"></button></aside>
    <div id="zone-title" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>
    <button id="interact" class="interact" hidden></button>
    <footer id="hotbar"><div id="weapon-slot" class="panel"></div><div id="quick-items"></div><div class="footer-actions"><button id="inventory" class="panel"></button><button id="journal" class="panel"></button></div></footer>
    <div id="hint"></div>
    <div id="touch-controls"><div id="stick" aria-label="Джойстик движения"><i></i></div><button id="touch-attack" aria-label="Атака">⌖</button><button id="touch-sprint" aria-label="Бег">»</button></div>
    <dialog id="modal"><div id="modal-body"></div></dialog>
    <div id="loading"><span class="brand-icon">✦</span><b>ПЕПЛОСВЕТ</b><span id="loading-text">Настраиваем частоту… / Tuning in…</span></div>
  </main>
  <script type="module" src="src/game.js"></script>
</body></html>
